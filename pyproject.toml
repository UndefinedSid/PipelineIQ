[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cicd-failure-triage"
version = "1.0.0"
description = "AI-Powered CI/CD Build Failure Triage Assistant"
readme = "README.md"
authors = [{ name = "AIOps Platform Team" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "typer[all]>=0.9.0",
    "rich>=13.7.0",
    "httpx>=0.26.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "PyGithub>=2.1.1"
]

[project.optional-dependencies]
openai = ["openai>=1.10.0"]
google = ["google-generativeai>=0.3.2"]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "flake8>=6.1.0",
    "bandit>=1.7.5"
]

[project.scripts]
triage = "triage.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
