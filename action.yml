name: "AI CI/CD Build Failure Triage Assistant"
description: "Automatically analyzes failed CI/CD workflow logs, isolates root causes, and posts actionable fixes to GitHub PRs."
author: "AIOps Platform Team"
branding:
  icon: "alert-triangle"
  color: "red"

inputs:
  github-token:
    description: "GitHub token to post PR comments"
    required: false
    default: ${{ github.token }}
  openai-api-key:
    description: "OpenAI API Key for LLM Triage"
    required: false
  llm-provider:
    description: "Provider to use ('mock', 'openai', 'ollama')"
    required: false
    default: "mock"
  pr-number:
    description: "Pull Request number (if triggered from PR)"
    required: false
    default: ${{ github.event.pull_request.number }}
  log-file:
    description: "Optional specific log file to analyze"
    required: false

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Assistant Dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -e ${{ github.action_path }}

    - name: Run Build Failure Triage
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        PR_NUMBER: ${{ inputs.pr-number }}
        LLM_PROVIDER: ${{ inputs.llm-provider }}
        REPO_NAME: ${{ github.repository }}
      run: |
        echo "Running AI CI/CD Failure Triage Assistant..."
        if [ -n "${{ inputs.log-file }}" ]; then
          triage analyze --log-file "${{ inputs.log-file }}" --provider "$LLM_PROVIDER" --repo "$REPO_NAME" --pr-number "$PR_NUMBER" --output-md "$GITHUB_STEP_SUMMARY"
        else
          # Fallback to analyzing test logs if present
          triage analyze --step "${{ github.job }}" --provider "$LLM_PROVIDER" --repo "$REPO_NAME" --pr-number "$PR_NUMBER" --output-md "$GITHUB_STEP_SUMMARY"
        fi
